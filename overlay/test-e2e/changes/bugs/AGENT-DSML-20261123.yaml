  change_type: bugfix
  bug_id: AGENT-DSML-20261123
  title: Reject unsupported tool-call markup and expose downloaded attachment paths
  description: Recover DSML as an action error instead of finishing with invisible markup; expose indexed local attachment paths.
  observed_behavior: Legacy fallback accepts DSML as final answer and attachment metadata omits downloaded paths.
  expected_behavior: Tool-call markup is not final prose; current downloaded paths are available as untrusted data.
  escaped_stage: D3
  coverage_gap:
    type: missing_boundary
    description: Existing final-answer and workspace tests lack DSML and indexed attachment metadata variants. Add UT; reuse observer regression without claiming DSML formal coverage.
  feature_contract_changed: false
  affected_features:
    existing: [FAF-001]
    added: []
    modified: []
    retired: []
  affected_cases:
    existing: [FAF-D1-001]
    added: []
    modified: []
    retired: []
  traditional_ut:
    decision: add
    behaviors:
    - Unsupported DSML cannot become a final answer in legacy or strict modes
    - Quoted documentation and ordinary answers remain valid
    - Indexed attachment paths match the executor namespace
    reason: These isolated classifier and query construction boundaries need regression assertions; existing formal observer case is complementary.
    test_selectors:
    - test/sdk/core/agents/test_dsml_attachment_regression.py
  notes: Lightweight design in nexent-doc/docs/Developing/agent-dsml-attachment-fix/design.md. Live smoke and import versus GUI configuration review recorded separately; no new formal cases.
